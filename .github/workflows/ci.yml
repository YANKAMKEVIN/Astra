name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Shared unit tests (Android host)
        run: ./gradlew :shared:testAndroidHostTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: shared/build/reports/tests/
          if-no-files-found: ignore

  ios:
    name: iOS unit tests (Kotlin/Native)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Kotlin/Native iOS work requires macOS. Running the simulator test suite compiles the
      # iOS test sources (which the Android host job never does) and executes them, so an iOS
      # test can no longer break in silence.
      - name: Shared unit tests (iOS simulator)
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace

      # Also compile the device target (can't be run without a device) to catch cinterop/API
      # breakages that neither the simulator nor the Android build surface (e.g. AVFAudio,
      # AuthenticationServices).
      - name: Compile iOS device target
        run: ./gradlew :shared:compileKotlinIosArm64 --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-report
          path: shared/build/reports/tests/
          if-no-files-found: ignore
